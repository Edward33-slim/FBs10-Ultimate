name: Build FBs10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract FBs10 project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q FBs10_GitHub_Ready.zip -d build-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        working-directory: build-src
        run: |
          gradle --no-daemon :app:assembleRelease

      - name: Show APK
        run: |
          find build-src/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FBs10-APK
          path: build-src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
