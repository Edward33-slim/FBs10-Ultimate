name: Delete All Actions Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-all:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "Deleting old workflow runs..."

          while true; do
            RUNS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id')

            OLD_RUNS=""

            for RUN_ID in $RUNS; do
              if [ "$RUN_ID" != "$CURRENT_RUN_ID" ]; then
                OLD_RUNS="$OLD_RUNS $RUN_ID"
              fi
            done

            if [ -z "$OLD_RUNS" ]; then
              break
            fi

            for RUN_ID in $OLD_RUNS; do
              echo "Deleting run $RUN_ID"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/$REPO/actions/runs/$RUN_ID" || true
            done
          done

          echo "All old runs deleted."
          echo "Deleting this run last..."

          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/runs/$CURRENT_RUN_ID" || true

          echo "Done."
