name: Delete Old Actions Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all old runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.run_id }}
        run: |
          while true; do
            IDS=$(gh api \
              "/repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id')

            FOUND=false

            for ID in $IDS; do
              if [ "$ID" != "$CURRENT" ]; then
                FOUND=true
                echo "Deleting run: $ID"
                gh api --method DELETE \
                  "/repos/$REPO/actions/runs/$ID" || true
              fi
            done

            if [ "$FOUND" = "false" ]; then
              break
            fi

            sleep 2
          done

          echo "DONE"
