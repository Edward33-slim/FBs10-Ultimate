name: Delete All Old Actions Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "Getting workflow runs..."

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.status)"' |
          while read RUN_ID STATUS; do

            if [ "$RUN_ID" != "$CURRENT_RUN_ID" ] && [ "$STATUS" = "completed" ]; then
              echo "Deleting completed run: $RUN_ID"

              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/$REPO/actions/runs/$RUN_ID" || true
            fi

          done

          echo "Finished deleting old runs."
